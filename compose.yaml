services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - chaos-site_default
    volumes:
      - ./vw-data:/data
    env_file: .env
    environment:
      - DOMAIN=https://${VW_DOMAIN}
      - SIGNUPS_ALLOWED=${VW_SIGNUPS_ALLOWED:-false}
      - SIGNUPS_VERIFY=${VW_SIGNUPS_VERIFY:-false}
      - SIGNUPS_DOMAINS_WHITELIST=${VW_SIGNUPS_DOMAINS_WHITELIST:-lockeinvestments.net}
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - INVITATIONS_ALLOWED=${VW_INVITATIONS_ALLOWED:-true}
      - SHOW_PASSWORD_HINT=${VW_SHOW_PASSWORD_HINT:-false}
      - WEBSOCKET_ENABLED=${VW_WEBSOCKET_ENABLED:-true}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "docker.group=vaultwarden"

networks:
  chaos-site_default:
    external: true
